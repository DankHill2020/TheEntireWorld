version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /tools/tech_connector/packaging
    schedule:
      interval: monthly
      day: monday
      time: '09:30'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      python-packaging:
        patterns:
          - '*'
